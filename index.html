<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Plug — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #7C3AED;
      --brand-dark: #5B21B6;
      --brand-light: #EDE9FE;
      --brand-xlight: #F5F3FF;
      --accent: #F59E0B;
      --green: #10B981;
      --red: #EF4444;
      --blue: #3B82F6;
      --orange: #F97316;
      --bg: #0F0D1A;
      --bg2: #1A1730;
      --surface: #1E1B2E;
      --surface2: #252240;
      --border: #2D2A45;
      --border2: #3D3A58;
      --text: #F0EEFF;
      --text2: #A8A3C8;
      --text3: #6B6894;
      --sidebar-w: 240px;
      --topbar-h: 64px;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    button { font-family: 'Inter', sans-serif; cursor: pointer; }
    input, textarea, select { font-family: 'Inter', sans-serif; }
    a { text-decoration: none; color: inherit; }

    /* ===== LAYOUT ===== */
    #root { display: flex; height: 100%; }

    /* AUTH */
    .auth-screen {
      width: 100%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, #2D1B69 0%, #0F0D1A 70%);
    }
    .auth-card {
      width: 100%; max-width: 420px; padding: 48px 40px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }
    .auth-logo { font-size: 26px; font-weight: 800; color: var(--brand); margin-bottom: 4px; }
    .auth-sub { font-size: 13px; color: var(--text3); margin-bottom: 36px; }
    .auth-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    .auth-input {
      width: 100%; padding: 12px 14px; background: var(--bg2);
      border: 1.5px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 14px; outline: none; margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: var(--brand); }
    .auth-btn {
      width: 100%; padding: 13px; background: var(--brand); color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-top: 4px;
    }
    .auth-btn:hover { background: var(--brand-dark); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-err { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; height: 100%; overflow-y: auto;
    }
    .sidebar-logo {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo-text { font-size: 17px; font-weight: 800; color: var(--brand); }
    .sidebar-logo-sub { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    .sidebar-section { padding: 12px 12px 4px; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; padding: 0 8px; margin-bottom: 4px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
      color: var(--text2); cursor: pointer; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
    .nav-item .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-item .nav-badge {
      margin-left: auto; background: var(--brand); color: white;
      font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
    }

    .sidebar-footer {
      margin-top: auto; padding: 16px; border-top: 1px solid var(--border);
    }
    .sidebar-user { display: flex; align-items: center; gap: 10px; }
    .sidebar-avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .sidebar-user-name { font-size: 13px; font-weight: 600; }
    .sidebar-user-role { font-size: 11px; color: var(--brand); }
    .logout-btn {
      margin-left: auto; border: none; background: none; color: var(--text3);
      cursor: pointer; padding: 4px; border-radius: 6px; display: flex; align-items: center;
    }
    .logout-btn:hover { color: var(--red); background: rgba(239,68,68,0.1); }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: var(--topbar-h); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 28px;
      background: var(--surface); flex-shrink: 0; gap: 16px;
    }
    .topbar-title { font-size: 18px; font-weight: 700; }
    .topbar-sub { font-size: 13px; color: var(--text3); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .topbar-badge {
      padding: 5px 12px; background: rgba(124,58,237,0.15); color: var(--brand);
      border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(124,58,237,0.3);
    }

    .page { flex: 1; overflow-y: auto; padding: 28px; }

    /* ===== STAT CARDS ===== */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 22px; position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .stat-card.purple::before { background: var(--brand); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.amber::before { background: var(--accent); }
    .stat-card.red::before { background: var(--red); }
    .stat-card.blue::before { background: var(--blue); }
    .stat-card.orange::before { background: var(--orange); }

    .stat-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; margin-bottom: 14px;
    }
    .stat-icon.purple { background: rgba(124,58,237,0.15); }
    .stat-icon.green { background: rgba(16,185,129,0.15); }
    .stat-icon.amber { background: rgba(245,158,11,0.15); }
    .stat-icon.red { background: rgba(239,68,68,0.15); }
    .stat-icon.blue { background: rgba(59,130,246,0.15); }
    .stat-icon.orange { background: rgba(249,115,22,0.15); }

    .stat-num { font-size: 30px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 12.5px; color: var(--text2); font-weight: 500; }
    .stat-delta { font-size: 11px; margin-top: 6px; }
    .stat-delta.up { color: var(--green); }
    .stat-delta.down { color: var(--red); }

    /* ===== CHARTS ===== */
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px;
    }
    .chart-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .chart-sub { font-size: 12px; color: var(--text3); margin-bottom: 20px; }
    .chart-wrap { position: relative; height: 220px; }

    /* ===== TABLE ===== */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .card-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .card-title { font-size: 15px; font-weight: 700; }
    .card-count { font-size: 12px; color: var(--text3); background: var(--surface2); padding: 3px 10px; border-radius: 20px; }
    .card-actions { margin-left: auto; display: flex; gap: 8px; }

    .search-box {
      padding: 8px 14px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; outline: none; width: 220px;
    }
    .search-box:focus { border-color: var(--brand); }
    .search-box::placeholder { color: var(--text3); }

    .filter-select {
      padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; outline: none; cursor: pointer;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 700;
      color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); background: var(--surface2);
    }
    td {
      padding: 13px 16px; font-size: 13.5px; border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .user-cell { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: white;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    }
    .user-name { font-weight: 600; font-size: 13.5px; }
    .user-handle { font-size: 11px; color: var(--text3); }

    /* BADGES */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-admin { background: rgba(124,58,237,0.2); color: #C4B5FD; border: 1px solid rgba(124,58,237,0.3); }
    .badge-verified { background: rgba(59,130,246,0.2); color: #93C5FD; border: 1px solid rgba(59,130,246,0.3); }
    .badge-restricted { background: rgba(245,158,11,0.2); color: #FCD34D; border: 1px solid rgba(245,158,11,0.3); }
    .badge-banned { background: rgba(239,68,68,0.2); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
    .badge-hub { background: rgba(16,185,129,0.2); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }
    .badge-active { background: rgba(16,185,129,0.15); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.25); }
    .badge-post { background: rgba(124,58,237,0.15); color: #C4B5FD; }
    .badge-listing { background: rgba(245,158,11,0.15); color: #FCD34D; }

    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-danger { background: rgba(239,68,68,0.15); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-warn { background: rgba(245,158,11,0.15); color: #FCD34D; border: 1px solid rgba(245,158,11,0.3); }
    .btn-warn:hover { background: rgba(245,158,11,0.25); }
    .btn-success { background: rgba(16,185,129,0.15); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }
    .btn-success:hover { background: rgba(16,185,129,0.25); }
    .btn-blue { background: rgba(59,130,246,0.15); color: #93C5FD; border: 1px solid rgba(59,130,246,0.3); }
    .btn-blue:hover { background: rgba(59,130,246,0.25); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 11px 22px; font-size: 14px; }
    .btn-full { width: 100%; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ICON BUTTONS */
    .icon-btn {
      width: 30px; height: 30px; border-radius: 6px; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; font-size: 15px;
    }
    .icon-btn:hover { background: var(--surface2); }
    .icon-btn.red:hover { background: rgba(239,68,68,0.15); }

    /* MODAL */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      padding: 24px; backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { opacity:0; transform: scale(0.95) translateY(10px); } to { opacity:1; transform: none; } }
    .modal-header {
      padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--surface2); color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    .modal-body { padding: 20px 24px 24px; }
    .modal-footer { padding: 0 24px 24px; display: flex; gap: 10px; justify-content: flex-end; }

    /* FORM */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 11px 14px; background: var(--bg2);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--brand); }
    .form-textarea { resize: none; min-height: 100px; }
    .form-select option { background: var(--surface); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-hint { font-size: 11px; color: var(--text3); margin-top: 5px; }

    /* TOAST */
    #toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      padding: 12px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4); animation: toastIn 0.3s ease;
      max-width: 320px;
    }
    @keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: none; } }
    .toast-success { background: #065F46; color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }
    .toast-error { background: #7F1D1D; color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
    .toast-info { background: var(--surface); color: var(--text2); border: 1px solid var(--border); }

    /* TABS */
    .page-tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; width: fit-content; }
    .page-tab {
      padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600;
      color: var(--text2); cursor: pointer; border: none; background: none; transition: all 0.15s;
    }
    .page-tab.active { background: var(--brand); color: white; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 24px; color: var(--text3); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; }

    /* LOADER */
    .loader { display: flex; align-items: center; justify-content: center; padding: 48px; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border2);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* DIVIDER */
    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* STATUS DOT */
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot-red { background: var(--red); }
    .dot-amber { background: var(--accent); }

    /* GRID UTILS */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* UNI BREAKDOWN */
    .uni-bar-wrap { margin-bottom: 12px; }
    .uni-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .uni-bar-track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .uni-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

    /* HUB POST PREVIEW */
    .hub-post-preview {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin-top: 12px;
      border-left: 3px solid var(--brand);
    }
    .hub-post-preview-label { font-size: 10px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .hub-post-preview-text { font-size: 14px; color: var(--text); line-height: 1.5; }

    /* ACTIVITY LOG */
    .activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
    .activity-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .activity-content { flex: 1; }
    .activity-text { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .activity-time { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* POST CONTENT PREVIEW */
    .post-preview-text {
      font-size: 13px; color: var(--text2); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* RESPONSIVE */
    @media (max-width: 1100px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div id="root"></div>

<script>
// ========================================================
// CONFIG — Replace with your Supabase project values
// ========================================================
const SUPABASE_URL = 'https://zgzamthhfykhjaldosvb.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_T2qRKGsS33YJPN3BochPTA_r2v_gSlS'

// This dashboard is deployed on its OWN Vercel project/domain
// (campusadmin.vercel.app), separate from the main camplugie app
// (camplugie.com) — but the /api/paystack-*, /api/wallet-* and /api/admin-*
// serverless functions only exist in that OTHER project. So every call to
// them from here has to be an absolute URL pointing at camplugie.com, not a
// relative '/api/...' path (which would just 404 against this project's
// own, empty /api).
const SITE_API_BASE = 'https://camplugie.com'

const ADMIN_EMAILS = [
  'opemuhammad35@gmail.com',
  'sumudinnovation4@gmail.com',
  'campusplug04@gmail.com',
]

// ========================================================
// SUPABASE CLIENT
// ========================================================
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// ========================================================
// UTILS
// ========================================================
let toastTimer = {}
function toast(msg, type = 'info') {
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.textContent = msg
  document.getElementById('toast-container').appendChild(el)
  setTimeout(() => el.remove(), 3500)
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - new Date(ts)) / 1000)
  if (s < 60) return `${s}s ago`
  if (s < 3600) return `${Math.floor(s/60)}m ago`
  if (s < 86400) return `${Math.floor(s/3600)}h ago`
  return `${Math.floor(s/86400)}d ago`
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' })
}

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()
}

function numFmt(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k'
  return String(n)
}

function confirmAction(msg) {
  return window.confirm(msg)
}

function copyText(t) {
  if (!t) { toast('Nothing to copy', 'error'); return }
  const done = () => toast('Copied to clipboard', 'success')
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done))
  } else {
    fallbackCopy(t, done)
  }
}

function fallbackCopy(t, done) {
  const ta = document.createElement('textarea')
  ta.value = t
  ta.style.position = 'fixed'
  ta.style.opacity = '0'
  document.body.appendChild(ta)
  ta.select()
  try { document.execCommand('copy'); done() } catch (e) { toast('Copy failed', 'error') }
  ta.remove()
}

// Reads email + matric from a profile row, tolerating different column names

// Escape a value for safe use inside a single-quoted inline handler attribute
function escAttr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") }

// ========================================================
// AUTH
// ========================================================
// NOTE ON SECURITY: the ADMIN_EMAILS / is_admin checks below are a UX gate
// only — they decide whether THIS PAGE shows the dashboard. They are NOT
// what keeps the database safe, because anyone can read this file's source,
// grab SUPABASE_URL/ANON_KEY, and call the Supabase client directly from
// their own script, skipping this file entirely. The real enforcement lives
// in Postgres Row Level Security policies (see the SQL migration) which
// check `profiles.is_admin = true` for every admin-only read/write at the
// database layer, no matter who or what is making the request. Keep both:
// this check is what makes the UI feel right; RLS is what makes it actually
// secure.
async function checkAuth() {
  const { data: { session } } = await db.auth.getSession()
  if (!session) { renderAuth(); return }
  state.user = session.user
  const { data: profile, error: profileErr } = await db.from('profiles').select('*').eq('id', session.user.id).single()
  if (profileErr || !profile) {
    renderAuthError('Could not load your profile.')
    return
  }
  if (!profile.is_admin && !ADMIN_EMAILS.includes(session.user.email)) {
    renderAuthError('This account is not authorised to access the admin dashboard.')
    return
  }
  state.profile = profile
  renderApp()
  loadAll()
}

async function login(email, password) {
  const { data, error } = await db.auth.signInWithPassword({ email, password })
  if (error) return error.message
  const { data: profile } = await db.from('profiles').select('*').eq('id', data.user.id).single()
  if (!profile?.is_admin && !ADMIN_EMAILS.includes(email.toLowerCase())) {
    await db.auth.signOut()
    return 'This account does not have admin access.'
  }
  state.user = data.user
  state.profile = profile
  renderApp()
  loadAll()
  return null
}

async function logout() {
  await db.auth.signOut()
  state.user = null; state.profile = null
  renderAuth()
}

async function loadStats() {

  const [u, p, l, escrow, food, swift] = await Promise.all([
    db.from('profiles').select('*', { count: 'exact', head: true }),

async function loadGrowthData() {
  // Get users grouped by week for the last 12 weeks
  const since = new Date(Date.now() - 84 * 86400 * 1000).toISOString()
  const { data } = await db.from('profiles').select('created_at').gte('created_at', since).order('created_at')
  if (!data) return
  // Group by week
  const weeks = {}
  data.forEach(row => {
    const d = new Date(row.created_at)
    const week = new Date(d.setDate(d.getDate() - d.getDay())).toLocaleDateString('en-NG', { month: 'short', day: 'numeric' })
    weeks[week] = (weeks[week] || 0) + 1
  })
  state.growthData = Object.entries(weeks).map(([label, count]) => ({ label, count }))
  renderCharts()
}

async function loadUniBreakdown() {
  const { data } = await db.from('profiles').select('university_id').not('university_id', 'is', null)
  if (!data) return
  const counts = {}
  data.forEach(r => {
    const name = (state.uniMap && state.uniMap[r.university_id]) || 'Unknown'
    counts[name] = (counts[name] || 0) + 1
  })
  const total = Object.values(counts).reduce((a, b) => a + b, 0)
  state.uniBreakdown = Object.entries(counts).map(([name, count]) => ({ name, count, pct: Math.round(count/total*100) })).sort((a,b) => b.count - a.count)
  renderUniBreakdown()
}

async function loadUsers() {

// Camplugie has THREE kinds of orders, each in its own table with its own
// status machine — there is no unified 'orders' table in the schema:
//   escrow_orders  -> normal marketplace items, haggled in chat
//   food_orders    -> food-category quick checkout
//   swift_orders   -> runner-delivered errands (money for these actually
//                     moves through a linked escrow_orders row, so a Swift
//                     order's own status is just delivery tracking)
// This merges all three into one normalized list for the Orders page.
async function loadOrders() {
  const [escrow, food, swift] = await Promise.all([
    db.from('escrow_orders')
      .select('id, status, amount_kobo, created_at, listing_id, listings(title), buyer:buyer_id(username), seller:seller_id(username)')
      .order('created_at', { ascending: false }).limit(100),
    db.from('food_orders')
      .select('id, status, amount_kobo, items, created_at, buyer:buyer_id(username), seller:seller_id(username)')
      .order('created_at', { ascending: false }).limit(100),
    db.from('swift_orders')
      .select('id, status, fee, errand_type, created_at, buyer:buyer_id(username), runner:runner_id(username)')
      .order('created_at', { ascending: false }).limit(100),
  ])
  if (escrow.error) { toast('Escrow orders error: ' + escrow.error.message, 'error'); console.error(escrow.error) }
  if (food.error) { toast('Food orders error: ' + food.error.message, 'error'); console.error(food.error) }
  if (swift.error) { toast('Swift orders error: ' + swift.error.message, 'error'); console.error(swift.error) }

  const normalized = [
    ...(escrow.data || []).map(o => ({
      id: o.id, type: 'escrow', title: o.listings?.title || 'Item',
      buyerName: o.buyer?.username, sellerName: o.seller?.username,
      amount: (o.amount_kobo || 0) / 100, status: o.status, created_at: o.created_at,
    })),
    ...(food.data || []).map(o => ({
      id: o.id, type: 'food', title: (o.items || []).map(i => `${i.qty}× ${i.title}`).join(', ') || 'Food order',
      buyerName: o.buyer?.username, sellerName: o.seller?.username,
      amount: (o.amount_kobo || 0) / 100, status: o.status, created_at: o.created_at,
    })),
    ...(swift.data || []).map(o => ({
      // swift_orders.fee is stored in naira already (not kobo, unlike the other two tables)
      id: o.id, type: 'swift', title: o.errand_type === 'listing_pickup' ? 'Swift pickup' : 'Swift errand',
      buyerName: o.buyer?.username, sellerName: o.runner?.username,
      amount: o.fee || 0, status: o.status, created_at: o.created_at,
    })),
  ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at))

  state.orders = normalized
  renderOrders()
}

// Escrow/food orders can't have their status hand-edited from the admin —
// 'paid_escrow'/'paid' -> 'released' moves real money into the seller's
// wallet, and -> 'refunded' triggers an actual Paystack refund. Flipping
// the status column alone (the old behaviour) would desync the DB from
// reality — money wouldn't move, but the order would claim it had. So this
// calls the same serverless endpoints the app itself uses for these
// transitions, instead of writing the status column directly.
async function callOrderApi(path, orderType, orderId) {
  const res = await fetch(`${SITE_API_BASE}/api/${path}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order_type: orderType, order_id: orderId }),
  })
  let data
  try { data = await res.json() } catch { throw new Error(`Server didn't return JSON from /api/${path} (status ${res.status})`) }
  if (!res.ok) throw new Error(data.error || 'Request failed')
  return data
}

// Like callOrderApi, but for endpoints that need to verify the CALLER is an
// admin server-side (anything that can create or destroy money out of
// nothing, like a manual wallet adjustment, rather than just move money
// that a real payment already brought onto the platform).
async function callAdminApi(path, body) {
  const { data: { session } } = await db.auth.getSession()
  const res = await fetch(`${SITE_API_BASE}/api/${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session?.access_token || ''}` },
    body: JSON.stringify(body),
  })
  let data
  try { data = await res.json() } catch { throw new Error(`Server didn't return JSON from /api/${path} (status ${res.status})`) }
  if (!res.ok) throw new Error(data.error || 'Request failed')
  return data
}

// Reusable image upload used by any admin form that needs to attach a
// picture (Hub Post composer today; drop it into any future form the same
// way). Uses the same Cloudinary unsigned preset the rest of the app uses.
async function uploadImageToCloudinary(file) {
  const CLOUD_NAME = 'dkkowi2j9', PRESET = 'campusplug'
  const formData = new FormData()
  formData.append('file', file)
  formData.append('upload_preset', PRESET)
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData })
  const data = await res.json()
  if (!res.ok) throw new Error(data?.error?.message || 'Image upload failed')
  return data.secure_url
}
// Same as above, for forms that accept several receipt photos on one entry.
async function uploadImagesToCloudinary(files) {
  const urls = []
  for (const file of files) urls.push(await uploadImageToCloudinary(file))
  return urls
}

let pollOptCount = 2
function addPollOption() {
  const container = document.getElementById('poll-options')
  if (!container || pollOptCount >= 6) return
  const input = document.createElement('input')
  input.className = 'form-input'
  input.style.marginBottom = '8px'
  input.placeholder = `Option ${pollOptCount + 1}`
  input.id = `poll-opt-${pollOptCount}`
  container.appendChild(input)
  pollOptCount++
}

let hubImageFile = null
function handleHubImageSelect(e) {
  hubImageFile = e.target.files?.[0] || null
  const preview = document.getElementById('hub-image-preview')
  if (!preview) return
  preview.innerHTML = hubImageFile ? `<div style="font-size:12px;color:var(--text2)">📎 ${hubImageFile.name} — will upload on publish</div>` : ''
}

async function submitHubPost() {
  const content = document.getElementById('hub-content')?.value || ''
  const pollMode = document.getElementById('hub-poll-toggle')?.checked || false
  const endsIn = parseInt(document.getElementById('hub-ends-in')?.value || '48')
  const opts = []
  for (let i = 0; i < pollOptCount; i++) {
    const v = document.getElementById(`poll-opt-${i}`)?.value || ''
    if (v.trim()) opts.push(v.trim())
  }
  pollOptCount = 2

  let imageUrl = null
  if (hubImageFile) {
    try { imageUrl = await uploadImageToCloudinary(hubImageFile) }
    catch (err) { toast('Image upload failed: ' + err.message, 'error'); return }
  }
  hubImageFile = null
  await publishHubPost(content, pollMode, opts, endsIn, imageUrl)
}

async function doLogin() {
  const email = document.getElementById('auth-email').value.trim()
  const pass = document.getElementById('auth-pass').value
  const btn = document.getElementById('auth-btn')
  const errEl = document.getElementById('auth-err')
  errEl.innerHTML = ''
  btn.disabled = true; btn.textContent = 'Signing in...'
  const err = await login(email, pass)
  if (err) {
    errEl.innerHTML = `<div class="auth-err">${err}</div>`
    btn.disabled = false; btn.textContent = 'Sign In to Dashboard'
  }
}

    groups: ['Groups', 'Campus chat groups'],
    notifications: ['Broadcast', 'Send a notification to users'],
    'swift-settings': ['Swift Settings', 'Open/close Swift delivery per campus'],
  }
  const [title, sub] = titles[page] || [page, '']
  document.getElementById('topbar-title').textContent = title
  document.getElementById('topbar-sub').textContent = sub

  const pc = document.getElementById('page-content')

function renderCharts() {
  if (!state.growthData.length) return
  // Destroy old
  if (state.charts.growth) { state.charts.growth.destroy() }
  if (state.charts.uniPie) { state.charts.uniPie.destroy() }

  const gCtx = document.getElementById('growth-chart')
  if (gCtx) {
    state.charts.growth = new Chart(gCtx, {
      type: 'line',
      data: {
        labels: state.growthData.map(d => d.label),
        datasets: [{
          label: 'New Users',
          data: state.growthData.map(d => d.count),
          borderColor: '#7C3AED',
          backgroundColor: 'rgba(124,58,237,0.1)',
          borderWidth: 2.5,
          pointBackgroundColor: '#7C3AED',
          pointRadius: 4,
          fill: true,
          tension: 0.4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6B6894', font: { size: 11 } } },
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6B6894', font: { size: 11 }, precision: 0 } }
        }
      }
    })
  }

  const pCtx = document.getElementById('uni-pie-chart')
  if (pCtx && state.uniBreakdown.length) {
    const colors = ['#7C3AED', '#10B981', '#F59E0B', '#3B82F6', '#F97316', '#EF4444']
    state.charts.uniPie = new Chart(pCtx, {
      type: 'doughnut',
      data: {
        labels: state.uniBreakdown.map(u => u.name),
        datasets: [{
          data: state.uniBreakdown.map(u => u.count),
          backgroundColor: colors,
          borderWidth: 2, borderColor: '#1E1B2E'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#A8A3C8', font: { size: 11 }, boxWidth: 12 } }
        },
        cutout: '65%'
      }
    })
  }
}

async function removeListing(id) {
  if (!confirmAction('Remove this listing?')) return
  const {error:_le} = await db.from('listings').update({ is_available: false }).eq('id', id)
  if(_le){ toast('Remove failed: '+_le.message,'error'); console.error(_le); return }
  toast('Listing removed','success')
  loadListings()
}

let booksTypeFilter = 'all'
let bookReceiptFiles = []

async function loadBooks() {
  let q = db.from('book_entries').select('*, creator:created_by(username)').order('entry_date', { ascending: false }).order('created_at', { ascending: false }).limit(300)
  if (booksTypeFilter !== 'all') q = q.eq('type', booksTypeFilter)
  const { data, error } = await q
  if (error) { toast('Books error: ' + error.message, 'error'); console.error(error) }
  state.books = data || []
  renderBooks()
}

function renderBooks() {
  const pc = document.getElementById('page-content')
  if (!pc) return
  const sum = (t) => (state.books||[]).filter(e=>e.type===t).reduce((a,e)=>a+(e.amount_kobo||0),0)
  const income = sum('income'), expense = sum('expense'), investment = sum('investment'), ambPay = sum('ambassador_payment')
  const net = income + investment - expense - ambPay
  const TYPE_LABEL = { income: '💰 Income', expense: '💸 Expense', investment: '🏗️ Investment', ambassador_payment: '🎯 Ambassador Payment' }
  const TYPE_COLOR = { income: 'var(--green)', investment: 'var(--blue)', expense: 'var(--red)', ambassador_payment: 'var(--orange)' }

  pc.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px">
      <div class="stat-card green"><div style="font-size:18px;font-weight:800">₦${Number(income/100).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Income</div></div>
      <div class="stat-card blue"><div style="font-size:18px;font-weight:800">₦${Number(investment/100).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Investment in</div></div>
      <div class="stat-card red"><div style="font-size:18px;font-weight:800">₦${Number(expense/100).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Expenses</div></div>
      <div class="stat-card orange"><div style="font-size:18px;font-weight:800">₦${Number(ambPay/100).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Ambassador payouts</div></div>
      <div class="stat-card purple"><div style="font-size:18px;font-weight:800">₦${Number(net/100).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Net (shown entries)</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Books</span>
        <select class="filter-select" onchange="booksTypeFilter=this.value;loadBooks()">
          <option value="all" ${booksTypeFilter==='all'?'selected':''}>All types</option>
          <option value="income" ${booksTypeFilter==='income'?'selected':''}>Income</option>
          <option value="expense" ${booksTypeFilter==='expense'?'selected':''}>Expense</option>
          <option value="investment" ${booksTypeFilter==='investment'?'selected':''}>Investment</option>
          <option value="ambassador_payment" ${booksTypeFilter==='ambassador_payment'?'selected':''}>Ambassador Payment</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openBookEntryModal()">+ New Entry</button>
        <span class="card-count">${state.books.length}</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Counterparty</th><th>Amount</th><th>Description</th><th>Receipts</th><th>Logged by</th><th></th></tr></thead>
          <tbody>
            ${state.books.map(e => `<tr>
              <td style="font-size:12px;color:var(--text3);white-space:nowrap">${e.entry_date}</td>
              <td style="font-size:12px;color:${TYPE_COLOR[e.type]}">${TYPE_LABEL[e.type]||e.type}</td>
              <td style="font-size:13px">${e.category||'—'}</td>
              <td style="font-size:13px">${e.counterparty||'—'}</td>
              <td style="font-weight:700;color:${TYPE_COLOR[e.type]}">₦${Number((e.amount_kobo||0)/100).toLocaleString()}</td>
              <td style="font-size:12px;color:var(--text2);max-width:220px">${e.description||'—'}</td>

            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`

async function submitBookEntry() {

  const entry_date = document.getElementById('book-date')?.value
  const category = document.getElementById('book-category')?.value.trim()
  const counterparty = document.getElementById('book-counterparty')?.value.trim()

  if (!amountNaira || amountNaira <= 0) { toast('Enter a valid amount', 'error'); return }

  if (bookReceiptFiles.length) {
    try { receipt_urls = await uploadImagesToCloudinary(bookReceiptFiles) }
    catch (err) { toast('Receipt upload failed: ' + err.message, 'error'); return }

  const { error } = await db.from('book_entries').insert({

            <option value="all">All users</option>
            <option value="uni">One campus…</option>
          </select>
        </div>
        <div class="form-group" id="bc-uni-wrap" style="display:none">
          <label class="form-label">Campus</label>
          <select class="form-input" id="bc-uni">${uniOptions}</select>
        </div>
        <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="bc-title" placeholder="e.g. New feature: Swift delivery is live!"></div>
        <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" id="bc-body" placeholder="Write your message…"></textarea></div>
        <button class="btn btn-primary" onclick="sendBroadcast()" style="width:100%">📢 Send Notification</button>
      </div>
    </div>`
  document.getElementById('bc-audience').addEventListener('change', (e) => {
    document.getElementById('bc-uni-wrap').style.display = e.target.value === 'uni' ? 'block' : 'none'
  })
  if (!state.universitiesList) db.from('universities').select('id,name').order('name').then(({data}) => { state.universitiesList = data || []; if (state.page==='notifications') renderBroadcast() })
}
async function sendBroadcast() {
  const audience = document.getElementById('bc-audience')?.value
  const uniId = document.getElementById('bc-uni')?.value
  const title = document.getElementById('bc-title')?.value.trim()
  const body = document.getElementById('bc-body')?.value.trim()
  if (!title || !body) { toast('Fill in title and message', 'error'); return }
  if (!confirmAction(`Send this to ${audience==='all'?'ALL users':'this campus'}? This can't be undone.`)) return

  let q = db.from('profiles').select('id')
  if (audience === 'uni' && uniId) q = q.eq('university_id', uniId)
  const { data: users, error } = await q
  if (error) { toast('Failed to load audience: ' + error.message, 'error'); return }
  if (!users || !users.length) { toast('No matching users', 'error'); return }

  const rows = users.map(u => ({ user_id: u.id, type: 'broadcast', title, body, is_read: false }))
  // Chunk to keep each insert reasonably sized
  for (let i = 0; i < rows.length; i += 500) {
    const chunk = rows.slice(i, i + 500)
    const { error: insErr } = await db.from('notifications').insert(chunk)
    if (insErr) { toast('Broadcast partially failed: ' + insErr.message, 'error'); return }
  }
  toast(`📢 Sent to ${rows.length} users`, 'success')
  document.getElementById('bc-title').value = ''
  document.getElementById('bc-body').value = ''
}

    <div class="card" style="margin-bottom:20px;border-left:3px solid var(--accent)">
      <div class="card-header">
        <span class="card-title">⏳ Pending Approval</span>
        <span class="card-count">${pending.length}</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Name / Email</th><th>School</th><th>Applied</th><th>Actions</th></tr></thead>
          <tbody>
            ${pending.map(a => `<tr>
              <td>
                <div style="font-weight:600;font-size:13px">${a.full_name||'(no name)'}</div>
                <div style="font-size:11px;color:var(--text3)">${a.email||''}</div>
              </td>
              <td style="font-size:13px;color:var(--text2)">${a.school||'—'}</td>
              <td style="font-size:12px;color:var(--text3)">${fmtDate(a.created_at)}</td>
              <td>
                <div style="display:flex;gap:6px">
                  <button class="btn btn-success btn-sm" onclick="approveAmbassador('${a.id}')">✓ Give Access</button>
                  <button class="btn btn-danger btn-sm" onclick="rejectAmbassador('${a.id}')">✗ Reject</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}
    <div class="card">
      <div class="card-header">
        <span class="card-title">🏅 All Ambassadors</span>
        <span class="card-count">${list.length} total</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Ambassador</th><th>School</th><th>Code</th><th>Referrals</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${list.map(a => `<tr>
              <td>
                <div style="font-weight:600;font-size:13px">${a.full_name||'—'}</div>
                <div style="font-size:11px;color:var(--text3)">${a.email||''}</div>
              </td>
              <td style="font-size:13px;color:var(--text2)">${a.school||'—'}</td>
              <td style="font-family:monospace;font-size:12px;color:var(--brand)">${a.referral_code||'—'}</td>
              <td style="font-size:13px;font-weight:600">—</td>
              <td><span class="badge ${a.status==='approved'?'badge-hub':a.status==='rejected'?'badge-banned':'badge-restricted'}">${a.status}</span>${a.is_flagged?'<span class="badge badge-banned" style="margin-left:4px">🚩 Flagged</span>':''}</td>
              <td>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${a.status==='pending'?`<button class="btn btn-success btn-sm" onclick="approveAmbassador('${a.id}')">✓ Approve</button>`:''}
                  ${a.status==='approved'?`<button class="btn btn-warn btn-sm" onclick="revokeAmbassador('${a.id}')">Revoke</button>`:''}
                  ${!a.is_flagged?`<button class="btn btn-danger btn-sm" onclick="flagAmbassador('${a.id}')">🚩 Flag</button>`:
                    `<button class="btn btn-ghost btn-sm" onclick="unflagAmbassador('${a.id}')">Clear Flag</button>`}
                  <button class="btn btn-ghost btn-sm" onclick="openAmbDetailModal(${JSON.stringify(a).replace(/'/g,"&#39;")})">View</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`
}

async function approveAmbassador(id) {
  const { error } = await db.from('ambassadors').update({ status: 'approved', approved_at: new Date().toISOString() }).eq('id', id)
  if (error) { toast('Approve failed: ' + error.message, 'error'); return }
  toast('✅ Ambassador approved — they can now log in', 'success')
  loadAmbassadors()
}
async function rejectAmbassador(id) {
  if (!confirmAction('Reject this ambassador? They will see a rejection message on login.')) return
  const { error } = await db.from('ambassadors').update({ status: 'rejected' }).eq('id', id)
  if (error) { toast('Failed', 'error'); return }
  toast('Ambassador rejected', 'info')
  loadAmbassadors()
}
async function revokeAmbassador(id) {
  if (!confirmAction('Revoke access? Ambassador will be locked out.')) return
  await db.from('ambassadors').update({ status: 'pending' }).eq('id', id)
  toast('Access revoked', 'info')
  loadAmbassadors()
}
async function flagAmbassador(id) {
  await db.from('ambassadors').update({ is_flagged: true }).eq('id', id)
  toast('🚩 Ambassador flagged for fraud review. Earnings frozen.', 'error')
  loadAmbassadors()
}
async function unflagAmbassador(id) {
  await db.from('ambassadors').update({ is_flagged: false }).eq('id', id)
  toast('Flag cleared', 'success')
  loadAmbassadors()
}

function openAddAmbassadorModal() {
  let el = document.getElementById('modal-root')
  if (!el) { el = document.createElement('div'); el.id = 'modal-root'; document.body.appendChild(el) }
  el.innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><span class="modal-title">+ Add Ambassador</span><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="font-size:13px;color:var(--text2);margin-bottom:16px;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.25);padding:10px 14px;border-radius:8px">
          The ambassador must already have a Supabase auth account. Enter their user ID or email to link them.
        </div>
        <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="amb-name" placeholder="e.g. Fatima Usman"></div>
        <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" id="amb-email" placeholder="ambassador@email.com"></div>
        <div class="form-group"><label class="form-label">Auth User ID (from Supabase)</label><input class="form-input" id="amb-uid" placeholder="uuid"></div>
        <div class="form-group"><label class="form-label">School</label><input class="form-input" id="amb-school" placeholder="e.g. Bayero University Kano"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createAmbassador()">Create Ambassador</button>
      </div>
    </div>
  </div>`
}

async function createAmbassador() {
  const name = document.getElementById('amb-name')?.value.trim()
  const email = document.getElementById('amb-email')?.value.trim()
  const uid = document.getElementById('amb-uid')?.value.trim()
  const school = document.getElementById('amb-school')?.value.trim()
  if (!name || !email || !uid) { toast('Fill all required fields', 'error'); return }
  const { error } = await db.from('ambassadors').insert({
    user_id: uid, full_name: name, email, school,
    status: 'approved', approved_at: new Date().toISOString(),
    created_at: new Date().toISOString()
  })
  if (error) { toast('Failed: ' + error.message, 'error'); return }
  toast('✅ Ambassador created with access', 'success')
  closeModal(); loadAmbassadors()
}

function openAmbDetailModal(a) {
  let el = document.getElementById('modal-root')
  if (!el) { el = document.createElement('div'); el.id = 'modal-root'; document.body.appendChild(el) }
  el.innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:480px">
      <div class="modal-header"><span class="modal-title">🏅 Ambassador Detail</span><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="background:var(--surface2);border-radius:10px;padding:16px;margin-bottom:16px">
          <div style="font-size:18px;font-weight:800">${a.full_name||'Unknown'}</div>
          <div style="font-size:13px;color:var(--text3);margin-top:2px">${a.email||''}</div>
        </div>
        <div class="form-row">
          ${[['School',a.school],['Department',a.department],['Level',a.level],['Phone',a.phone],['WhatsApp',a.whatsapp],['Code',a.referral_code]].map(([k,v])=>`
            <div style="background:var(--bg2);padding:12px;border-radius:8px">
              <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px">${k}</div>
              <div style="font-weight:600;font-size:13px">${v||'—'}</div>
            </div>`).join('')}
        </div>
        <div style="margin-top:16px;padding:12px;background:var(--bg2);border-radius:8px;font-size:13px;color:var(--text2)">
          🔗 ${a.referral_link||'Not generated yet'}
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
    </div>
  </div>`
}

function openAnnouncementModal() {
  let el = document.getElementById('modal-root')
  if (!el) { el = document.createElement('div'); el.id = 'modal-root'; document.body.appendChild(el) }
  el.innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:480px">
      <div class="modal-header"><span class="modal-title">📢 Send Announcement to Ambassadors</span><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label class="form-label">Title</label><input class="form-input" id="ann-title" placeholder="e.g. New payout policy update"></div>
        <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" id="ann-body" placeholder="Write your announcement…"></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="sendAnnouncement()">📢 Send to All Ambassadors</button>
      </div>
    </div>
  </div>`
}

async function sendAnnouncement() {
  const title = document.getElementById('ann-title')?.value.trim()
  const body = document.getElementById('ann-body')?.value.trim()
  if (!title || !body) { toast('Fill all fields', 'error'); return }
  const { error } = await db.from('ambassador_announcements').insert({ title, body, is_active: true, created_at: new Date().toISOString() })
  if (error) { toast('Failed: ' + error.message, 'error'); return }
  toast('📢 Announcement sent to all ambassadors!', 'success')
  closeModal()
}

async function loadAmbReferrals() {
  const { data } = await db.from('ambassador_referrals')
    .select('*, ambassadors(full_name, referral_code, school)')
    .order('created_at', { ascending: false })
    .limit(200)
  const pc = document.getElementById('page-content')
  if (!pc) return
  const refs = data || []
  pc.innerHTML = `
    <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
      <div class="stat-card green" style="flex:1;min-width:140px"><div style="font-size:22px;font-weight:800">${refs.filter(r=>r.status==='verified').length}</div><div style="font-size:12px;color:var(--text2)">Total Verified</div></div>
      <div class="stat-card amber" style="flex:1;min-width:140px"><div style="font-size:22px;font-weight:800">${refs.filter(r=>r.status==='pending').length}</div><div style="font-size:12px;color:var(--text2)">Pending Verification</div></div>
      <div class="stat-card red" style="flex:1;min-width:140px"><div style="font-size:22px;font-weight:800">${refs.filter(r=>r.is_flagged).length}</div><div style="font-size:12px;color:var(--text2)">Flagged</div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">All Referrals</span><span class="card-count">${refs.length}</span></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Student</th><th>Ambassador</th><th>School</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${refs.map(r => `<tr>
              <td>
                <div style="font-weight:600;font-size:13px">${r.student_name||'Unknown'}</div>
                <div style="font-size:11px;color:var(--text3)">${r.student_email||''}</div>
              </td>
              <td style="font-size:13px;color:var(--brand)">${r.ambassadors?.full_name||'—'} <span style="color:var(--text3);font-size:11px">${r.ambassadors?.referral_code||''}</span></td>
              <td style="font-size:13px;color:var(--text2)">${r.student_school||'—'}</td>
              <td style="font-size:12px;color:var(--text3)">${fmtDate(r.created_at)}</td>
              <td><span class="badge ${r.status==='verified'?'badge-hub':r.status==='rejected'?'badge-banned':'badge-restricted'}">${r.status}</span>${r.is_flagged?'<span class="badge badge-banned" style="margin-left:4px">🚩</span>':''}</td>
              <td>
                <div style="display:flex;gap:6px">
                  ${r.status==='pending'?`
                    <button class="btn btn-success btn-sm" onclick="verifyReferral('${r.id}')">✓ Verify</button>
                    <button class="btn btn-danger btn-sm" onclick="rejectReferral('${r.id}')">✗ Reject</button>
                  `:''}
                  ${!r.is_flagged?`<button class="btn btn-warn btn-sm" onclick="flagReferral('${r.id}')">🚩 Flag</button>`:''}
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`
}

async function verifyReferral(id) {
  const { error } = await db.from('ambassador_referrals').update({ status: 'verified', verified_at: new Date().toISOString() }).eq('id', id)
  if (error) { toast('Failed', 'error'); return }
  toast('✅ Referral verified — earnings unlocked', 'success')
  loadAmbReferrals()
}
async function rejectReferral(id) {
  const { error } = await db.from('ambassador_referrals').update({ status: 'rejected' }).eq('id', id)
  if (error) { toast('Failed', 'error'); return }
  toast('Referral rejected', 'info')
  loadAmbReferrals()
}
async function flagReferral(id) {
  await db.from('ambassador_referrals').update({ is_flagged: true }).eq('id', id)
  toast('🚩 Referral flagged for review', 'error')
  loadAmbReferrals()
}

async function loadAmbPayouts() {
  const { data } = await db.from('ambassador_payouts')
    .select('*, ambassadors(full_name, referral_code)')
    .order('created_at', { ascending: false })
  const pc = document.getElementById('page-content')
  if (!pc) return
  const payouts = data || []
  const pending = payouts.filter(p => p.status === 'pending')
  pc.innerHTML = `
    <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
      <div class="stat-card amber" style="flex:1;min-width:140px"><div style="font-size:22px;font-weight:800">${pending.length}</div><div style="font-size:12px;color:var(--text2)">Pending Requests</div></div>
      <div class="stat-card green" style="flex:1;min-width:140px"><div style="font-size:22px;font-weight:800">₦${Number(payouts.filter(p=>p.status==='paid').reduce((a,b)=>a+(b.amount||0),0)).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Total Paid Out</div></div>
      <div class="stat-card purple" style="flex:1;min-width:140px"><div style="font-size:22px;font-weight:800">₦${Number(pending.reduce((a,b)=>a+(b.amount||0),0)).toLocaleString()}</div><div style="font-size:12px;color:var(--text2)">Pending Amount</div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Payout Requests</span><span class="card-count">${payouts.length}</span></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Ambassador</th><th>Amount</th><th>Bank</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${payouts.map(p => `<tr>
              <td style="font-weight:600;font-size:13px">${p.ambassadors?.full_name||'—'} <span style="color:var(--text3);font-size:11px">${p.ambassadors?.referral_code||''}</span></td>
              <td style="font-weight:700;color:var(--green);font-size:14px">₦${Number(p.amount||0).toLocaleString()}</td>
              <td style="font-size:13px;color:var(--text2)">${p.bank_name||'—'} · ${p.account_number||'—'}</td>
              <td style="font-size:12px;color:var(--text3)">${fmtDate(p.created_at)}</td>
              <td><span class="badge ${p.status==='paid'?'badge-hub':p.status==='rejected'?'badge-banned':'badge-restricted'}">${p.status}</span></td>
              <td>
                <div style="display:flex;gap:6px">
                  ${p.status==='pending'?`
                    <button class="btn btn-success btn-sm" onclick="approvePayout('${p.id}')">✓ Mark Paid</button>
                    <button class="btn btn-danger btn-sm" onclick="rejectPayout('${p.id}')">✗ Reject</button>
                  `:p.status==='paid'?'<span style="color:var(--text3);font-size:12px">Paid ✓</span>':''}
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`
}

async function approvePayout(id) {
  const { error } = await db.from('ambassador_payouts').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('id', id)
  if (error) { toast('Failed', 'error'); return }
  toast('✅ Payout marked as paid', 'success')
  loadAmbPayouts()
}
async function rejectPayout(id) {
  const { error } = await db.from('ambassador_payouts').update({ status: 'rejected' }).eq('id', id)
  if (error) { toast('Failed', 'error'); return }
  toast('Payout rejected', 'info')
  loadAmbPayouts()
}

let debounceTimers = {}
function debounceLoad(type) {
  clearTimeout(debounceTimers[type])
  debounceTimers[type] = setTimeout(() => {
    if (type === 'users') loadUsers()
    if (type === 'posts') loadPosts()
  }, 350)
}

checkAuth()
